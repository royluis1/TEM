<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cuidate Online – Guía contra estafas</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4faf9;--card:#fff;--text:#12302f;--muted:#3f5d5b;--primary:#06766f;--onprimary:#fff;--brand:#055860;--accent:#fc9320;--mint:#acdbd7;--bad:#a8211a;--badbg:#fdeceb;--good:#17653a;--goodbg:#e6f4ec;--line:#cde2de;color-scheme:light;box-sizing:border-box;padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a2a2e;--card:#103a3f;--text:#eef8f6;--muted:#b9d6d2;--primary:#4fd6c6;--onprimary:#04302c;--bad:#ff9a92;--badbg:#3a1f1d;--good:#86d6a3;--goodbg:#143527;--line:#25565c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0a2a2e;--card:#103a3f;--text:#eef8f6;--muted:#b9d6d2;--primary:#4fd6c6;--onprimary:#04302c;--bad:#ff9a92;--badbg:#3a1f1d;--good:#86d6a3;--goodbg:#143527;--line:#25565c;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-behavior:smooth;font-size:112.5%}
body{margin:0;background:var(--bg);color:var(--text);font-family:Montserrat,"Trebuchet MS",Verdana,Arial,sans-serif;line-height:1.6}
.band{background:var(--brand);padding:calc(16px + env(safe-area-inset-top,0px)) 18px 16px;text-align:center;border-bottom:6px solid var(--accent)}
.band .logo{width:100%;max-width:300px;height:auto;display:block;margin:0 auto}
.foot{border-bottom:0;border-top:6px solid var(--accent);padding:22px 18px calc(22px + env(safe-area-inset-bottom,0px));margin-top:36px}
.foot .logos{display:flex;gap:30px;justify-content:center;align-items:center;flex-wrap:wrap}
.foot .logos img{height:110px;width:auto}
.foot p{color:var(--mint);margin:16px 0 0;font-size:.9rem}
.wrap{max-width:760px;margin:0 auto;padding:18px 18px 10px}
h1,h2,h3{font-family:Montserrat,"Trebuchet MS",Verdana,Arial,sans-serif;font-weight:800;line-height:1.2;margin:0 0 .5em}
h1{font-size:2rem}h2{font-size:1.45rem;margin-top:1.5em}h3{font-size:1.15rem}
p{margin:.5em 0 1em}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.acts{display:flex;gap:10px;flex-wrap:wrap}
input{font:600 1.1rem Montserrat,"Trebuchet MS",Verdana,sans-serif;padding:14px;border-radius:12px;border:3px solid var(--line);background:var(--card);color:var(--text);width:100%;margin:8px 0 6px}
label{font-weight:700}
table{width:100%;border-collapse:collapse;background:var(--card);border-radius:12px;overflow:hidden}
th,td{padding:12px;text-align:left;border-bottom:2px solid var(--line)}
th{background:var(--brand);color:#fff}
.score{font-weight:800;white-space:nowrap;color:var(--primary)}
.brand{font-weight:800;font-size:1.1rem;color:var(--primary)}
button,.btn{font:800 1rem Montserrat,"Trebuchet MS",Verdana,sans-serif;padding:14px 20px;border-radius:14px;border:3px solid var(--primary);background:var(--primary);color:var(--onprimary);cursor:pointer;min-height:54px;text-decoration:none;display:inline-block}
button.alt,.btn.alt{background:var(--card);color:var(--primary)}
a:focus,button:focus{outline:4px solid var(--accent);outline-offset:2px}
.hero{background:var(--brand);color:#fff;border-radius:18px;padding:24px 22px;margin:16px 0;border-left:8px solid var(--accent)}
.hero h2{margin-top:0;color:#fff}.hero p{font-size:1.05rem;margin:0;color:var(--mint)}
.lvl{display:block;background:var(--card);border:3px solid var(--line);border-radius:18px;padding:18px 20px;margin:14px 0;color:var(--text);text-decoration:none}
.lvl:hover,.lvl:focus{border-color:var(--accent)}
.lvl .n{display:inline-block;background:var(--accent);color:#1d1d1b;font-weight:800;font-size:.95rem;border-radius:999px;padding:4px 14px;margin-bottom:8px}
.lvl h3{margin-bottom:.2em}.lvl p{margin:0;color:var(--muted)}
.rule{display:grid;gap:10px;margin:12px 0}
.rule div{background:var(--card);border:3px solid var(--primary);border-radius:16px;padding:14px 18px}
.rule b{display:block;font-weight:800;font-size:1.3rem;color:var(--primary)}
.card{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:16px 20px;margin:14px 0}
.tag{display:inline-block;background:var(--badbg);color:var(--bad);font-weight:700;font-size:.85rem;padding:3px 10px;border-radius:999px;margin-bottom:8px}
.do{background:var(--goodbg);border-left:6px solid var(--good);padding:10px 14px;border-radius:8px;margin-top:10px}
.do b{color:var(--good)}
ul{padding-left:1.2em}li{margin:.45em 0}
.quiz{background:var(--card);border:3px solid var(--line);border-radius:18px;padding:20px}
.q{font-size:1.1rem;font-weight:700;margin-bottom:14px;word-break:break-word}
.btns{display:flex;gap:12px;flex-wrap:wrap}
.fb{margin-top:14px;padding:14px 16px;border-radius:12px}
.fb.ok{background:var(--goodbg);border:2px solid var(--good)}
.fb.no{background:var(--badbg);border:2px solid var(--bad)}
.meta{color:var(--muted);font-size:.95rem}
.url{font-family:Consolas,Menlo,monospace;background:var(--card);border:2px solid var(--line);border-radius:10px;padding:12px;word-break:break-all;margin:10px 0}
.url mark{background:var(--goodbg);color:var(--text);border:2px solid var(--good);border-radius:6px;padding:0 4px}
.help{background:var(--goodbg);border:2px solid var(--good);border-radius:16px;padding:6px 20px 12px;margin-top:26px}
</style>
</head>

intro:"Tres ideas alcanzan para protegerte de la mayoría de los engaños. Leelas despacio, no hay apuro.",
tips:["Si alguien te apura, <b>cortá</b>. Las urgencias son casi siempre trampa.","Nunca digas a nadie tus <b>claves</b>, el número de tu tarjeta ni los <b>códigos</b> que te llegan por mensaje.","Ante la duda, llamá vos a un familiar de confianza <b>antes</b> de hacer algo."],
scams:[

["Familiar en apuros","“Abuela, estoy en problemas”","Alguien finge ser tu nieto, hijo o abogado, pide plata urgente y que no le cuentes a nadie.","Cortá y llamá vos a tu familiar a su número de siempre. Acuerden una <b>palabra secreta</b> en la familia."],
["WhatsApp","“Te mandé un código por error”","Te piden que les reenvíes un código de 6 números. Con eso se quedan con tu WhatsApp.","Nunca compartas códigos que te lleguen por mensaje, ni con conocidos."],

quiz:[
['¿Para qué sirve la pantalla de inicio del celular?',0,'Desde ahí abrís las aplicaciones y las funciones del celular.',['Para acceder a aplicaciones y funciones.','Para cargar la batería.','Para apagar internet.']],['¿Qué significa deslizar el dedo por la pantalla?',0,'Es mover el contenido para desplazarte, por ejemplo hacia abajo en una lista.',['Mover el contenido para desplazarse.','Eliminar todas las aplicaciones.','Apagar el teléfono.']],['¿Qué permite conectarse a internet?',0,'El celular se conecta con Wi-Fi o con datos móviles.',['Wi-Fi o datos móviles.','La cámara únicamente.','El volumen del teléfono.']],['¿Qué es una aplicación?',0,'Una aplicación (o app) es un programa que sirve para hacer una tarea, como mandar mensajes.',['Un programa que permite realizar una tarea.','Un cable para cargar el celular.','Una parte de la pantalla.']],['¿Para qué sirve un navegador?',0,'El navegador te permite visitar páginas web.',['Para visitar páginas web.','Para aumentar el volumen.','Para cargar la batería.']],['¿Dónde conviene descargar aplicaciones?',0,'Descargá solo desde la tienda oficial de tu celular. Los enlaces desconocidos pueden traer virus.',['Desde tiendas oficiales.','Desde cualquier enlace desconocido.','Desde mensajes de personas que no conocemos.']],['¿Qué debemos hacer con nuestra contraseña?',0,'La contraseña es personal: no se publica ni se manda a nadie.',['Mantenerla privada y no compartirla.','Publicarla para no olvidarla.','Enviar la clave por WhatsApp.']],['Si recibís un mensaje SOSPECHOSO que pide un código, ¿qué hacés?',0,'Nunca compartas el código. Verificá por un canal oficial, llamando vos.',['No lo compartís y verificás por un canal oficial.','Lo enviás rápidamente.','Lo reenviás a todos tus contactos.']],['¿Cómo podemos reconocer un enlace seguro en una página web?',1,'Los enlaces suelen verse azules y subrayados, y las direcciones seguras empiezan con HTTPS. Igual, fijate también que el sitio sea el oficial.',['Porque aparece en color extra:"<h2>Cómo leer una dirección web</h2><p>El <b>dominio real</b> es lo que está justo antes de la primera barra “/”. Leé de derecha a izquierda desde ahí.</p><div class=\"url\">https://www.<mark>mercadolibre.com.ar</mark>/ofertas</div><p>Eso es una dirección oficial. En cambio, en esta el dominio real es <b>pagos-seguros.net</b>:</p><div class=\"url\">https://mercadolibre.com.ar.<mark>pagos-seguros.net</mark>/ingresar</div><p>El <b>candado</b> solo indica que la conexión está cifrada. Las páginas falsas también lo tienen, así que <b>no alcanza</b>.</p>",
tips:["Escribí vos la dirección o usá tus favoritos, en lugar de entrar desde un enlace recibido.","Desconfiá de letras parecidas (como “rn” en vez de “m”) y de direcciones con guiones de más.","Los primeros resultados de un buscador pueden ser anuncios falsos. Fijate que diga “Anuncio” y revisá el dominio.","Usá un <b>gestor de claves</b> y verificación en dos pasos con una app, no solo por SMS.","Revisá desde “Dispositivos vinculados” (WhatsApp) y en tu correo qué sesiones están abiertas.","En apps nuevas, mirá los permisos: una linterna no necesita tus contactos."],

var app=document.getElementById("app"),qi=0,done=false,cur=null,score=0,curKey="",dbP=null,uid=null,unsub=null,rowsNow=[];
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];});}
function home(){
app.innerHTML='<h1>Cuidate Online</h1><div class="hero"><h2>No es tu culpa. Los estafadores son profesionales.</h2><p>Elegí el nivel que más se parezca a vos. Podés cambiar cuando quieras.</p></div>'+
Object.keys(L).map(function(k){var v=L[k];return '<a class="lvl" href="#'+k+'"><span class="n">Nivel '+v.n+'</span><h3>'+v.t.split(" · ")[1]+'</h3><p>'+v.sub+'</p></a>'}).join("")+
'<h2>La regla de oro para todos</h2><div class="rule"><div><b>1. Pará</b>Si te apuran o te asustan, es mala señal.</div><div><b>2. Pensá</b>¿Alguien te pide plata, una clave o un código? Un banco real no.</div><div><b>3. Preguntá</b>Cortá y llamá vos a un familiar o al número oficial.</div></div>';
}
function level(k){
var v=L[k];cur=v;curKey=k;qi=0;score=0;
app.innerHTML='<p><a class="btn alt" href="#inicio">← Volver al inicio</a></p><h1>'+v.t+'</h1><p class="meta">'+v.sub+'</p><div class="hero"><p>'+v.intro+'</p></div><p><button type="button" id="goq">Ir directo a la evaluación ↓</button></p>'+
(v.extra||"")+
'<h2>Lo más importante</h2><ul>'+v.tips.map(function(t){return '<li>'+t+'</li>'}).join("")+'</ul>'+
'<h2>Estafas que tenés que conocer</h2>'+
v.scams.map(function(s){return '<article class="card"><span class="tag">'+s[0]+'</span><h3>'+s[1]+'</h3><p>'+s[2]+'</p><div class="do"><b>Qué hacer:</b> '+s[3]+'</div></article>'}).join("")+
'<h2 id="quizh">Evaluación</h2><div class="quiz" aria-live="polite"><p class="meta" id="cnt"></p><div class="q" id="qq"></div><div class="btns" id="ch"><button type="button" data-a="1">Es estafa</button><button type="button" class="alt" data-a="0">Parece seguro</button></div><div id="fb"></div><div class="btns" style="margin-top:14px"><button type="button" id="nx" hidden>Siguiente</button></div></div>'+
'<div class="help"><h2 style="margin-top:.8em">Si ya caíste, no te quedes callado</h2><ul><li>Llamá enseguida a tu banco al número oficial y pedí bloquear tarjetas y cuentas.</li><li>Cambiá tus claves desde un dispositivo de confianza.</li><li>Hacé la denuncia y contale a un familiar. Pedir ayuda rápido ayuda mucho.</li></ul></div>'+
'<p style="margin-top:22px"><a class="btn" href="#inicio">← Elegir otro nivel</a></p>';
showQ();
}
function showQ(){
done=false;var q=cur.quiz[qi];
document.getElementById("cnt").textContent="Pregunta "+(qi+1)+" de "+cur.quiz.length;
document.getElementById("qq").textContent=q[0];var ch2=document.getElementById("ch");ch2.innerHTML=q[3]?q[3].map(function(o,i){return i;}).sort(function(){return Math.random()-.5;}).map(function(i,p){return '<button type="button" class="alt" style="width:100%;text-align:left" data-a="'+i+'">'+'ABC'.charAt(p)+') '+q[3][i]+'</button>';}).join(''):'<button type="button" data-a="1">Es estafa</button><button type="button" class="alt" data-a="0">Parece seguro</button>';
document.getElementById("fb").innerHTML="";document.getElementById("nx").hidden=true;
}
app.addEventListener("click",function(e){
var b=e.target.closest("button");if(!b||!cur)return;
if(b.id==="goq"){document.getElementById("quizh").scrollIntoView({behavior:"smooth"});return;}
if(b.id==="savebtn"){var nm=document.getElementById("nm"),name=nm.value.trim();if(!name){nm.focus();return;}b.disabled=true;var tot=cur.quiz.length,sc=score;saveResult(name,sc,tot).then(function(w){document.getElementById("sv").innerHTML="<p><b>¡Listo, "+esc(name)+"!</b> Tu resultado "+sc+"/"+tot+" quedó guardado "+(w==="shared"?"en la tabla compartida.":"en este dispositivo.")+"</p><a class=\"btn\" href=\"#tabla\">🏆 Ver tabla de concursantes</a>";});return;}
if(b.dataset.a!==undefined&&!done){
done=true;var q=cur.quiz[qi],ok=Number(b.dataset.a)===q[1];if(ok)score++;
document.getElementById("fb").innerHTML='<div class="fb '+(ok?"ok":"no")+'"><b>'+(ok?"¡Muy bien! ":"Cuidado. ")+'</b>'+q[2]+'</div>'+(qi===cur.quiz.length-1?'<div class="fb ok"><b>Tu resultado: '+score+' de '+cur.quiz.length+'</b></div>'+saveForm():'');
var nx=document.getElementById("nx");nx.hidden=false;nx.textContent=qi<cur.quiz.length-1?"Siguiente":"Volver a empezar";nx.focus();
}else if(b.id==="nx"){qi=(qi+1)%cur.quiz.length;if(qi===0)score=0;showQ();}
});

function saveForm(){return '<div class="card" id="sv"><p><b>Guardá tu resultado en la tabla de concursantes</b></p><label for="nm">Tu nombre</label><input id="nm" type="text" maxlength="40" autocomplete="name" placeholder="Escribí tu nombre"><p class="meta">Tu nombre y tu puntaje se verán en la tabla.</p><button type="button" id="savebtn">Guardar mi resultado</button></div>';}
function saveResult(name,sc,tot){
var rec={name:name,k:curKey,s:sc,t:tot,ts:Date.now()},where="local";
try{var arr=JSON.parse(localStorage.getItem("tem_res")||"[]");arr.push(rec);localStorage.setItem("tem_res",JSON.stringify(arr.slice(-300)));}catch(e){}
if(!(dbP&&uid))return Promise.resolve(where);
var ref=dbP.doc("resultados/"+uid);
return ref.get().then(function(snap){var d=snap.exists?(snap.data()||{}):{},n=d.niveles||{},pv=n[rec.k];
if(!pv||rec.s>=pv.s)n[rec.k]={s:rec.s,t:rec.t,ts:rec.ts};
return ref.set({name:name,niveles:n});}).then(function(){return "shared";}).catch(function(){return where;});
}
function rowsFromLocal(){var m={};try{JSON.parse(localStorage.getItem("tem_res")||"[]").forEach(function(r){var key=r.name.toLowerCase()+"|"+r.k;if(!m[key]||r.s>=m[key].s)m[key]=r;});}catch(e){}return Object.keys(m).map(function(k){return m[k];});}
function draw(rows,note){
var nt=document.getElementById("tnote"),box=document.getElementById("tbody");if(!nt||!box)return;
nt.textContent=note;
rows.sort(function(a,b){return (b.s/b.t)-(a.s/a.t)||b.s-a.s||a.ts-b.ts;});rowsNow=rows;
if(!rows.length){box.innerHTML='<div class="card">Todavía no hay resultados. ¡Sé la primera persona en rendir la evaluación!</div>';return;}
box.innerHTML='<table><thead><tr><th>#</th><th>Nombre</th><th>Nivel</th><th>Puntaje</th></tr></thead><tbody>'+rows.map(function(r,i){return '<tr><td>'+(i+1)+'</td><td>'+esc(r.name)+'</td><td>'+(L[r.k]?'Nivel '+L[r.k].n:'')+'</td><td class="score">'+r.s+'/'+r.t+'</td></tr>';}).join('')+'</tbody></table>';
}
function table(){
app.innerHTML='<p><a class="btn alt" href="#inicio">← Volver al inicio</a></p><h1>🏆 Tabla de concursantes</h1><p class="meta" id="tnote"></p><div id="tbody" style="overflow-x:auto"></div><p style="margin-top:18px"><button type="button" id="dl" class="alt" hidden>Descargar tabla (CSV)</button></p>';
if(dbP){unsub=dbP.collection("resultados").onSnapshot(function(snap){var rows=[];snap.docs.forEach(function(d){var v=d.data()||{},n=v.niveles||{};Object.keys(n).forEach(function(k){rows.push({name:String(v.name||"Sin nombre"),k:k,s:n[k].s,t:n[k].t,ts:n[k].ts||0});});});draw(rows,"Tabla compartida con todas las personas que abren esta página con su cuenta.");},function(){draw(rowsFromLocal(),"No se pudo leer la tabla compartida. Se muestran los resultados de este dispositivo.");});}
else draw(rowsFromLocal(),"Resultados guardados en este dispositivo.");
if(window.claude&&claude.use)claude.use("downloads").then(function(d){var b=document.getElementById("dl");if(!d||!b)return;b.hidden=false;b.onclick=function(){
function c(x){x=String(x);if("=+-@".indexOf(x.charAt(0))>=0)x="'"+x;return '"'+x.replace(/"/g,'""')+'"';}
var csv="Nombre,Nivel,Puntaje\n"+rowsNow.map(function(r){return [c(r.name),c(L[r.k]?"Nivel "+L[r.k].n:""),c(r.s+"/"+r.t)].join(",");}).join("\n");
d.save({filename:"tabla-concursantes.csv",data:csv}).catch(function(){});};}).catch(function(){});
}
function initDb(){try{if(!(window.claude&&claude.use))return;Promise.all([claude.use("user"),claude.use("db")]).then(function(r){if(!(r[0]&&r[1]))return;return r[0].id().then(function(id){if(id){uid=id;dbP=r[1];if(location.hash==="#tabla"){if(unsub){unsub();unsub=null;}table();}}});}).catch(function(){});}catch(e){}}
function route(){
var h=(location.hash||"").slice(1);cur=null;if(unsub){unsub();unsub=null;}
if(h==="tabla")table();else if(L[h])level(h);else home();
window.scrollTo(0,0);
}
window.addEventListener("hashchange",route);route();initDb();
var size=112.5;
document.getElementById("bigger").addEventListener("click",function(){size=size>=150?112.5:size+12.5;document.documentElement.style.fontSize=size+"%"});
})();
</script>
